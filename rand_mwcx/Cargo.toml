[package]
name = "rand_mwcx"
version = "0.1.0"
authors = ["The Rand Project Developers"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-random/rngs"
documentation = "https://docs.rs/rand_mwcx"
homepage = "https://rust-random.github.io/book"
description = "Scrambled multiply-with-carry random number generators"
keywords = ["random", "rng", "mwc"]
categories = ["algorithms", "no-std"]
edition = "2024"
rust-version = "1.85"

[package.metadata.docs.rs]
all-features = true

[features]
serde = ["dep:serde"]

[dependencies]
rand_core = "0.10.0"
serde = { version = "1.0.118", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
# This is for testing serde, unfortunately we can't specify feature-gated dev
# deps yet, see: https://github.com/rust-lang/cargo/issues/1596
postcard = {version = "1.1.3", default-features = false, features = ["alloc"] }
